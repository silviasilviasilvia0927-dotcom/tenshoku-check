<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>30秒でチェック あなたに合う相談先はどれ？</title>
<meta name="description" content="辞めることは、逃げじゃない。4つの質問に答えるだけで、あなたに合う相談先のタイプが分かります。">
<style>
  :root {
    --text: #222;
    --sub: #666;
    --line: #dcdfe3;
    --accent: #2f6f9f;
    --accent-dark: #25587f;
    --bg-soft: #f5f7f9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
    line-height: 1.8;
    font-size: 16px;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 20px 56px; }
  h1 { font-size: 22px; line-height: 1.5; margin: 0 0 16px; }
  .lead { color: var(--sub); margin: 0 0 28px; }
  .progress { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .bar { height: 6px; background: var(--bg-soft); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
  .question { font-size: 18px; font-weight: bold; margin: 0 0 16px; line-height: 1.6; }
  .options { list-style: none; margin: 0; padding: 0; }
  .options li { margin-bottom: 12px; }
  button { font-family: inherit; font-size: 16px; cursor: pointer; }
  .option {
    width: 100%; text-align: left; padding: 14px 16px;
    background: #fff; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .option:hover, .option:focus-visible { border-color: var(--accent); background: var(--bg-soft); outline: none; }
  .btn-primary {
    display: block; width: 100%; text-align: center; text-decoration: none;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 14px 16px; font-weight: bold;
  }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-sub {
    display: block; width: 100%; margin-top: 20px; padding: 12px 16px;
    background: #fff; color: var(--sub); border: 1px solid var(--line); border-radius: 8px;
  }
  .btn-sub:hover { background: var(--bg-soft); }
  .result-label { font-size: 13px; color: var(--sub); margin: 0 0 4px; }
  .result-type { font-size: 22px; margin: 0 0 16px; line-height: 1.5; }
  .result h3 { font-size: 16px; margin: 24px 0 8px; padding-left: 10px; border-left: 4px solid var(--accent); }
  .result ul { margin: 0; padding-left: 1.3em; }
  .result li { margin-bottom: 6px; }
  .cta { margin-top: 28px; text-align: center; }
  .pr { font-size: 11px; color: var(--sub); margin: 6px 0 0; }
  .note { font-size: 12px; color: var(--sub); margin-top: 32px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>30秒でチェック<br>あなたに合う相談先はどれ？</h1>
  <p class="lead">辞めることは、逃げじゃない。4つの質問に答えるだけで、あなたに合う相談先のタイプが分かります。</p>

  <section id="quiz" aria-live="polite">
    <div class="progress" id="progress"></div>
    <div class="bar"><span id="bar"></span></div>
    <p class="question" id="question"></p>
    <ul class="options" id="options"></ul>
  </section>

  <section id="result" class="result" hidden aria-live="polite">
    <p class="result-label">あなたに合う相談先のタイプ</p>
    <h2 class="result-type" id="rType"></h2>
    <p id="rReason"></p>
    <h3>相談するときに確認したいポイント</h3>
    <ul id="rPoints"></ul>
    <div class="cta">
      <a class="btn-primary" href="https://lit.link/tetsu_tenshoku" target="_blank" rel="noopener sponsored">相談先を見てみる</a>
      <p class="pr">（PR）</p>
    </div>
    <button type="button" class="btn-sub" id="restart">最初からやり直す</button>
  </section>

  <p class="note">※この診断は一般的な目安です。最終的なご判断はご自身で行ってください。</p>
</main>

<script>
(function () {
  var questions = [
    { q: "Q1　あなたの年代は？", o: [
      { t: "20代", s: { A: 2 } },
      { t: "30代", s: { B: 1, C: 1 } },
      { t: "40代以上", s: { B: 2 } }
    ]},
    { q: "Q2　今の気持ちに一番近いのは？", o: [
      { t: "とにかく今の職場を辞めたい", s: { A: 1, C: 1 } },
      { t: "辞めたいけど不安が大きい", s: { A: 1, C: 2 } },
      { t: "年収や条件を上げたい", s: { B: 2 } },
      { t: "まだ決めていない", s: { A: 1, C: 1 } }
    ]},
    { q: "Q3　転職で一番大事にしたいのは？", o: [
      { t: "年収アップ", s: { B: 2 } },
      { t: "休みや働き方", s: { A: 1, C: 1 } },
      { t: "自分に合う職場の環境", s: { C: 2 } },
      { t: "担当者との相性", s: { C: 2 } }
    ]},
    { q: "Q4　相談相手に求めるのは？", o: [
      { t: "実績の多さ", s: { A: 1, B: 1 } },
      { t: "親身に話を聞いてくれること", s: { A: 1, C: 1 } },
      { t: "条件交渉の強さ", s: { B: 2 } },
      { t: "特にこだわりなし", s: { A: 1 } }
    ]}
  ];

  var results = {
    A: {
      name: "A「20代向けの相談先」タイプ",
      reason: "若手ならではの経験や伸びしろを評価してもらいやすい時期です。第二新卒や未経験分野への挑戦も含め、「何から始めればいいか分からない」段階から話せる、20代の転職に慣れた相談先が合っています。",
      points: [
        "20代・第二新卒の転職支援の実績があるか",
        "未経験の職種・業界への転職についても相談できるか",
        "今すぐ辞めるべきか、続けるべきかも含めて話を聞いてもらえるか"
      ]
    },
    B: {
      name: "B「年収の相談」タイプ",
      reason: "年収や条件を上げたい気持ちが強いあなたには、これまでの経験をどう評価してもらえるかを一緒に整理し、条件面の交渉まで任せられる相談先が合っています。",
      points: [
        "あなたの職種・年代での年収アップの事例があるか",
        "年収や待遇の交渉を、本人に代わって行ってもらえるか",
        "年収以外（働き方・将来性）も含めて比較して提案してくれるか"
      ]
    },
    C: {
      name: "C「自分に合う担当探し」タイプ",
      reason: "不安が大きい、職場の環境や相性を大切にしたいあなたには、サービスの知名度よりも「自分の話をじっくり聞いてくれる担当者」と出会えることが重要です。合わなければ担当を変えてもらえるかも大切です。",
      points: [
        "最初の面談で、希望や不安を最後まで聞いてくれるか",
        "担当者が合わないと感じたとき、変更を相談できるか",
        "求人の紹介だけでなく、職場の雰囲気や働き方も具体的に教えてもらえるか"
      ]
    }
  };

  var idx = 0, score;
  var $ = function (id) { return document.getElementById(id); };

  function reset() {
    idx = 0; score = { A: 0, B: 0, C: 0 };
    $("result").hidden = true;
    $("quiz").hidden = false;
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    var item = questions[idx];
    $("progress").textContent = "質問 " + (idx + 1) + " / " + questions.length;
    $("bar").style.width = (idx / questions.length * 100) + "%";
    $("question").textContent = item.q;
    var ul = $("options");
    ul.innerHTML = "";
    item.o.forEach(function (opt) {
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "option";
      b.textContent = opt.t;
      b.addEventListener("click", function () { answer(opt); });
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  function answer(opt) {
    for (var k in opt.s) score[k] += opt.s[k];
    idx++;
    if (idx < questions.length) { render(); } else { showResult(); }
  }

  function showResult() {
    var best = "A";
    ["B", "C"].forEach(function (k) { if (score[k] > score[best]) best = k; });
    var r = results[best];
    $("rType").textContent = r.name;
    $("rReason").textContent = r.reason;
    var ul = $("rPoints");
    ul.innerHTML = "";
    r.points.forEach(function (p) {
      var li = document.createElement("li");
      li.textContent = p;
      ul.appendChild(li);
    });
    $("quiz").hidden = true;
    $("result").hidden = false;
    window.scrollTo(0, 0);
  }

  $("restart").addEventListener("click", reset);
  reset();
})();
</script>
</body>
</html>
